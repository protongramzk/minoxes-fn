<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <title>MINOXES Finenote</title>
  
  <!-- CDNs: KaTeX, Marked, JSZip -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <!-- Google Fonts & Material Symbols (M3) -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

  <style>
    /* CSS Reset & M3 Tokens */
    :root {
      --bg: #111318; --surface: #191c20; --surf-low: #212429; --surf-hi: #2b2e33;
      --primary: #efa770; --on-primary: #551700; --p-container: #00468a; --on-p-container: #d6e3ff;
      --error: #ffb4ab; --on-error: #690005; --text: #e2e2e9; --text-sec: #c4c6d0; --outline: #44474f;
      --radius-s: 8px; --radius-m: 16px; --radius-l: 28px;
    }
    [data-theme="light"] {
      --bg: #f8f9ff; --surface: #f2f3f9; --surf-low: #eaebf1; --surf-hi: #e2e2e9;
      --primary: #ff8b20; --on-primary: #ffffff; --p-container: #d6e3ff; --on-p-container: #001b3e;
      --error: #ba1a1a; --on-error: #ffffff; --text: #191c20; --text-sec: #44474f; --outline: #74777f;
    }

    /* Fix Overflow Mobile: Ganti 100vw/vh jadi 100% & 100dvh */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Google Sans Flex', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; width: 100%; height: 100dvh; }
    
    .icon { font-family: 'Material Symbols Rounded'; font-size: 20px; font-weight: normal; font-style: normal; display: inline-block; line-height: 1; text-transform: none; letter-spacing: normal; word-wrap: normal; white-space: nowrap; direction: ltr; }

    /* Animations */
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes popIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
    
    .view:not(.hidden) { animation: fadeSlide 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .card { animation: popIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    
    /* Global App Container */
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    .hidden { display: none !important; }
    
    /* Buttons with Energy Charge Effect */
    .btn { 
      border: none; background: var(--surf-hi); color: var(--text); padding: 12px 20px; 
      border-radius: var(--radius-l); cursor: pointer; font-weight: 600; 
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; 
      
      /* Disable select text pada button */
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      
      /* Transisi cool-down (cepat balik normal saat dilepas) */
      transition: transform 0.61s cubic-bezier(0.4, 0, 0.2, 1), filter 0.75s ease-out, background-color 0.3s ease-out; 
    }
    
    .btn:active { 
      transform: scale(0.93); 
      /* Visual pas nge-charge: makin vibrant dan terang */
      filter: blur(5px) saturate(7.5) brightness(1.2); 
      /* Transisi charging (lambat 1.5 detik saat ditahan) */
      transition: transform 0.02s cubic-bezier(0.4, 0, 0.2, 1), filter 2s ease-in, background-color 1.5s ease-in; 
    }
    
    .btn-primary { background: var(--primary); color: var(--on-primary); }
    .btn-danger { background: var(--error); color: var(--on-error); }
    .btn-icon { padding: 12px; border-radius: 50%; }

    /* Header */
    header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-shrink: 0; }
    header h1 { font-size: 1.25rem; font-weight: 700; }

    /* Home View */
    #view-home { flex: 1; overflow-y: auto; padding: 0 16px 100px 16px; width: 100%; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .card { background: var(--surface); padding: 16px; border-radius: var(--radius-m); cursor: pointer; user-select: none; transition: background 0.2s; }
    .card:active { transform: scale(0.97); }
    .card.selected { background: var(--p-container); color: var(--on-p-container); }
    .card-header { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
    .card-title { font-weight: 600; font-size: 1.05rem; }
    .card-tag { font-family: monospace; background: var(--surf-hi); padding: 4px 8px; border-radius: var(--radius-s); font-size: 0.75rem; letter-spacing: 0.5px; }
    .card.selected .card-tag { background: var(--primary); color: var(--on-primary); }
    .card-snippet { font-size: 0.9rem; color: var(--text-sec); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }

    /* Floating Dock */
    .floating-dock { position: absolute; bottom: 24px; left: 16px; right: 16px; background: var(--surf-low); padding: 8px; border-radius: var(--radius-l); display: flex; gap: 8px; align-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 20; }
    .input { border: none; background: transparent; padding: 12px; color: var(--text); font-family: inherit; font-size: 1rem; outline: none; width: 100%; }
    
    /* Write View (Fullscreen Grid Anti-Overflow) */
    #view-write { 
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
      width: 100%; height: 100%; /* Fix overflow */
      display: grid; 
      grid-template-columns: 1fr 100px; 
      grid-template-rows: 64px 1fr 64px; 
      background: var(--outline); 
      gap: 1px; 
      z-index: 30; 
      overflow: hidden; /* Pastikan nggak ada elemen yang bocor */
    }
    #view-write > * { background: var(--bg); border: none; outline: none; padding: 16px; font-family: inherit; font-size: 1rem; color: var(--text); width: 100%; height: 100%; }
    #write-title { grid-column: 1 / 2; grid-row: 1 / 2; font-weight: 700; font-size: 1.1rem; }
    #write-tag { grid-column: 2 / 3; grid-row: 1 / 2; font-family: monospace; text-align: center; color: var(--primary); }
    #write-content { grid-column: 1 / 3; grid-row: 2 / 3; resize: none; font-family: monospace; line-height: 1.5; padding: 20px; overflow-y: auto; }
    .write-actions { grid-column: 1 / 3; grid-row: 3 / 4; display: flex; gap: 1px; padding: 0 !important; background: var(--outline) !important; }
    .write-actions button { flex: 1; border-radius: 0; background: var(--bg); color: var(--text); font-size: 1rem; font-weight: 600; height: 100%; }
    .write-actions button:active { background: var(--surf-low); transform: none; filter: saturate(2) brightness(1.2); transition: filter 1s ease-in, background 1s ease-in; }
    .write-actions button.primary { color: var(--primary); }

    /* Read View */
    #view-read { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 20; display: flex; flex-direction: column; overflow: hidden; }
    .read-header { display: flex; justify-content: space-between; padding: 16px; background: var(--bg); align-items: center; box-shadow: 0 1px 0 var(--outline); z-index: 25; flex-shrink: 0; }
    .read-container { flex: 1; overflow: auto; padding: 24px; touch-action: pan-x pan-y; width: 100%; } 
    
    /* Cegah overflow dari konten hasil render (LaTeX/Kode panjang) */
    #read-compiled { font-size: calc(1rem * var(--zoom, 1)); line-height: 1.6; transform-origin: top left; transition: font-size 0.1s ease-out; overflow-wrap: break-word; word-wrap: break-word; max-width: 100%; }
    #read-compiled h1 { font-size: 1.8em; margin-bottom: 8px; }
    #read-compiled hr { border: none; border-top: 1px solid var(--outline); margin: 16px 0; }
    #read-compiled p { margin-bottom: 12px; }
    #read-compiled pre { max-width: 100%; overflow-x: auto; padding: 12px; border-radius: 8px; }
    .katex-display { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
    #read-compiled code { font-family: monospace; background: var(--surf-low); padding: 2px 6px; border-radius: 6px; font-size: 0.9em; word-break: break-all; }
    
    .reader-link { color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; padding: 2px 4px; background: var(--p-container); border-radius: 4px; }

    /* Settings */
    #view-settings { flex: 1; padding: 20px; width: 100%; overflow-y: auto; }
    .setting-item { display: flex; justify-content: space-between; align-items: center; background: var(--surface); padding: 16px 20px; border-radius: var(--radius-m); margin-bottom: 12px; }
  </style>

</head>
<body>

<div id="app">
  <!-- Header -->
  <header id="main-header">
    <h1>MINOXES</h1>
    <button class="btn btn-icon" id="btn-settings-toggle" onclick="navTo('settings')">
      <span class="icon">settings</span>
    </button>
  </header>

  <!-- 1. HOME VIEW -->
  <main id="view-home" class="view">
    <div id="notes-grid" class="grid"></div>

    <div class="floating-dock" id="floating-dock">
      <div id="dock-default" style="display:flex; width:100%; gap:8px;">
        <span class="icon" style="padding-left:12px; color:var(--text-sec)">search</span>
        <input type="text" id="search-input" class="input" placeholder="Cari catatan..." oninput="renderHome()">
        <button class="btn btn-primary" style="padding: 12px 24px;" onclick="createNewNote()">
          <span class="icon">edit_square</span> Baru
        </button>
      </div>
      
      <div id="dock-select" class="hidden" style="width:100%; justify-content:space-between; align-items:center; padding: 0 8px;">
        <span id="select-count" style="font-weight:600; font-size:0.9rem;">0 terpilih</span>
        <div style="display:flex; gap:8px;">
          <button class="btn" onclick="selectAllNotes()"><span class="icon">done_all</span></button>
          <button class="btn btn-danger" onclick="deleteSelectedNotes()"><span class="icon">delete</span></button>
          <button class="btn" onclick="clearSelection()"><span class="icon">close</span></button>
        </div>
      </div>
    </div>
  </main>

  <!-- 2. WRITE VIEW (Fullscreen Grid) -->
  <main id="view-write" class="view hidden">
    <input type="text" id="write-title" placeholder="Judul Catatan">
    <input type="text" id="write-tag" placeholder="ID">
    <textarea id="write-content" placeholder="Ketik idemu... Markdown, $LaTeX$, atau link(id).nama() disupport penuh."></textarea>
    <div class="write-actions">
      <button onclick="navTo('home')">Batal</button>
      <button class="primary" onclick="saveNote()">Simpan</button>
    </div>
  </main>

  <!-- 3. READ VIEW -->
  <main id="view-read" class="view hidden">
    <div class="read-header">
      <button class="btn btn-icon" onclick="navTo('home')"><span class="icon">arrow_back</span></button>
      <div style="display:flex; gap:8px;">
        <button class="btn" onclick="resetZoom()"><span class="icon">search</span></button>
        <button class="btn btn-primary" onclick="openWriteView(currentNoteId)">
          <span class="icon">edit</span> Edit
        </button>
      </div>
    </div>
    <div class="read-container" id="read-container">
      <div id="read-compiled"></div>
    </div>
  </main>

  <!-- 4. SETTINGS VIEW -->
  <main id="view-settings" class="view hidden">
    <div class="setting-item">
      <span>Mode Tampilan</span>
      <button class="btn" onclick="toggleTheme()" id="theme-btn">
        <span class="icon">dark_mode</span> Dark
      </button>
    </div>
    <div class="setting-item">
      <span>Ekspor ZIP Backup</span>
      <button class="btn btn-primary" onclick="exportToZip()">
        <span class="icon">download</span> Ekspor
      </button>
    </div>
    <button class="btn" onclick="navTo('home')" style="width:100%; margin-top:16px;">
      <span class="icon">arrow_back</span> Kembali
    </button>
  </main>
</div>

<script>
  let notes = JSON.parse(localStorage.getItem('minoxes_notes') || '[]');
  let currentNoteId = null;
  let selectedIds = new Set();
  let longPressTimer = null;

  // Zoom State
  let currentZoom = 1.0;
  let initialDistance = 0;

  window.onload = () => { initTheme(); renderHome(); };

  function navTo(viewName) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById(`view-${viewName}`).classList.remove('hidden');
    document.getElementById('main-header').style.display = (viewName === 'home' || viewName === 'settings') ? 'flex' : 'none';
    if(viewName === 'home') { clearSelection(); renderHome(); }
  }

  function generateId() { return Math.random().toString(36).substring(2, 7); }
  function saveToStorage() { localStorage.setItem('minoxes_notes', JSON.stringify(notes)); }
  function escapeHtml(str) { return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  // --- HOME & SELECTION ---
  function renderHome() {
    const grid = document.getElementById('notes-grid');
    const query = document.getElementById('search-input').value.toLowerCase();
    grid.innerHTML = '';
    
    // Add staggered animation delay
    notes.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query) || n.tag.toLowerCase().includes(query))
      .forEach((note, index) => {
        const card = document.createElement('div');
        card.className = `card ${selectedIds.has(note.id) ? 'selected' : ''}`;
        card.style.animationDelay = `${index * 0.05}s`; // Stagger effect
        
        card.addEventListener('touchstart', (e) => startLongPress(e, note.id));
        card.addEventListener('touchend', cancelLongPress);
        card.addEventListener('mousedown', (e) => startLongPress(e, note.id));
        card.addEventListener('mouseup', cancelLongPress);
        card.addEventListener('mouseleave', cancelLongPress);
        card.onclick = () => handleCardClick(note.id);

        card.innerHTML = `
          <div class="card-header">
            <span class="card-title">${escapeHtml(note.title || 'Tanpa Judul')}</span>
            <span class="card-tag">#${note.tag}</span>
          </div>
          <div class="card-snippet">${escapeHtml(note.content || 'Kosong...')}</div>
        `;
        grid.appendChild(card);
      });
  }

  function startLongPress(e, id) {
    longPressTimer = setTimeout(() => {
      navigator.vibrate && navigator.vibrate(50); // Haptic feedback if supported
      toggleSelectNote(id);
      longPressTimer = null;
    }, 500);
  }
  function cancelLongPress() { if(longPressTimer) clearTimeout(longPressTimer); }
  
  function handleCardClick(id) {
    if (longPressTimer === null) return; // Prevent click if long press triggered
    if (selectedIds.size > 0) toggleSelectNote(id);
    else openReadView(id);
  }

  function toggleSelectNote(id) {
    if (id) {
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
    }
    const dockDef = document.getElementById('dock-default');
    const dockSel = document.getElementById('dock-select');
    
    if (selectedIds.size > 0) {
      dockDef.style.display = 'none'; dockSel.style.display = 'flex';
      dockSel.classList.remove('hidden');
      document.getElementById('select-count').innerText = `${selectedIds.size} terpilih`;
    } else {
      clearSelection();
    }
    renderHome();
  }

  function clearSelection() {
    selectedIds.clear();
    document.getElementById('dock-default').style.display = 'flex';
    document.getElementById('dock-select').style.display = 'none';
    document.getElementById('dock-select').classList.add('hidden');
    renderHome();
  }

  function selectAllNotes() { notes.forEach(n => selectedIds.add(n.id)); toggleSelectNote(null); }
  function deleteSelectedNotes() { notes = notes.filter(n => !selectedIds.has(n.id)); saveToStorage(); clearSelection(); }

  // --- WRITE ---
  function createNewNote() {
    const newNote = { id: Date.now().toString(), tag: generateId(), title: '', content: '', updated: Date.now() };
    notes.unshift(newNote); saveToStorage(); openWriteView(newNote.id);
  }

  function openWriteView(id) {
    currentNoteId = id; const note = notes.find(n => n.id === id);
    document.getElementById('write-title').value = note.title;
    document.getElementById('write-tag').value = note.tag;
    document.getElementById('write-content').value = note.content;
    navTo('write');
  }

  function saveNote() {
    const note = notes.find(n => n.id === currentNoteId);
    if (note) {
      note.title = document.getElementById('write-title').value;
      note.tag = document.getElementById('write-tag').value || generateId();
      note.content = document.getElementById('write-content').value;
      note.updated = Date.now(); saveToStorage();
    }
    openReadView(note.id); // Langsung ke baca
  }

  // --- READ & PARSER ---
  function openReadView(id) {
    currentNoteId = id; const note = notes.find(n => n.id === id);
    if (!note) return;

    let parsed = marked.parse(note.content || '');
    // LaTeX render
    parsed = parsed.replace(/\$\$(.*?)\$\$/gs, (_, tex) => { try { return katex.renderToString(tex, { displayMode: true }); } catch (e) { return tex; } });
    parsed = parsed.replace(/\$(.*?)\$/g, (_, tex) => { try { return katex.renderToString(tex, { displayMode: false }); } catch (e) { return tex; } });
    
    // Custom Syntax: link(id).name()
    parsed = parsed.replace(/link\(([a-zA-Z0-9_-]+)\)\.name\(([^)]+)\)/g, (match, tagId, name) => {
      return `<a class="reader-link" onclick="hrefNote('${tagId}')">${name}</a>`;
    });

    document.getElementById('read-compiled').innerHTML = `<h1>${escapeHtml(note.title || 'Tanpa Judul')}</h1><hr><br>` + parsed;
    resetZoom();
    navTo('read');
  }

  window.hrefNote = (idOrTag) => {
    const target = notes.find(n => n.tag === idOrTag || n.id === idOrTag);
    if (target) openReadView(target.id);
    else alert("Catatan tidak ditemukan!");
  };

  // --- PINCH TO ZOOM LOGIC ---
  const readContainer = document.getElementById('read-container');
  const readCompiled = document.getElementById('read-compiled');

  readContainer.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
    }
  });

  readContainer.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault(); // Mencegah scroll default pas nge-zoom
      const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
      const diff = currentDistance - initialDistance;
      
      currentZoom = Math.max(0.6, Math.min(3.0, currentZoom + (diff * 0.005)));
      readCompiled.style.setProperty('--zoom', currentZoom);
      initialDistance = currentDistance;
    }
  });

  function resetZoom() { currentZoom = 1.0; readCompiled.style.setProperty('--zoom', currentZoom); }

  // --- SETTINGS ---
  function initTheme() {
    const theme = localStorage.getItem('minoxes_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    updateThemeBtn(theme);
  }
  function toggleTheme() {
    const curr = document.documentElement.getAttribute('data-theme');
    const next = curr === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('minoxes_theme', next);
    updateThemeBtn(next);
  }
  function updateThemeBtn(theme) {
    document.getElementById('theme-btn').innerHTML = theme === 'dark' ? '<span class="icon">light_mode</span> Terang' : '<span class="icon">dark_mode</span> Gelap';
  }

  function exportToZip() {
    const zip = new JSZip();
    notes.forEach(note => {
      zip.file(`${note.tag}_${(note.title||'').replace(/[^a-z0-9]/gi, '_')}.md`, `---\nid: ${note.id}\ntag: ${note.tag}\n---\n\n${note.content}`);
    });
    zip.generateAsync({ type: 'blob' }).then(blob => {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `MINOXES_Backup.zip`; a.click();
    });
  }
</script>
</body>
</html>
